<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <!-- Para que se vea bien en diferentes tamaños de pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pinpoint</title>
    <style>

        /* Estilo general de la pagina */
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Fondo y centrado de todo el contenido */
        body {
            margin: 0;
            background-color: #2c3e50;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Cuadro principal del juego */
        .container {
            width: 380px;
            background-color: #34495e;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        /* Texto que aparece debajo del titulo */
        .subtitulo {
            color: #d0d3d4;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        /* Selector de idioma */
        select {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        /* Estilo de los botones */
        .btn-principal {
            margin-top: 15px;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Cambio de color al pasar el mouse */
        .btn-principal:hover {
            background-color: #0369a1;
        }

        /* Parte donde se mostrara el juego */
        #zona-juego {
            margin-top: 25px;
        }

        #numero-pista {
            font-weight: bold;
        }

        /* Cuadro donde se mostrara cada pista */
        #pista {
            background-color: #2c3e50;
            padding: 15px;
            margin: 15px 0;
            border-radius: 5px;
            min-height: 50px;
        }

        /* Tipo de relacion de la pista */
        #relacion-pista {
            font-size: 14px;
            color: #d0d3d4;
        }

        /* Campo donde el jugador escribe su respuesta */
        #respuesta {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
        }

        #mensaje {
            margin-top: 15px;
        }

        /* Numero de intentos realizados */
        #intentos {
            font-size: 14px;
            color: #d0d3d4;
        }

        #estado-juego {
            font-weight: bold;
            margin-top: 10px;
        }

        /* Aqui se puede mostrar la respuesta al terminar */
        #respuesta-final {
            margin-top: 10px;
            font-weight: bold;
        }

    </style>
</head>

<body>

    <!-- Contenedor principal -->
    <div class="container">

        <h1>Pinpoint</h1>

        <p class="subtitulo">
            Adivina la palabra con las pistas
        </p>

        <!-- Pantalla inicial -->
        <div id="inicio">

            <label for="idioma">Idioma:</label>

            <!-- Idiomas que acepta el modelo -->
            <select id="idioma">
                <option value="spa">Español</option>
                <option value="eng">Inglés</option>
            </select>

            <button class="btn-principal" id="iniciar">
                Iniciar juego
            </button>

        </div>

        <!-- Esta parte empieza oculta y se muestra al iniciar -->
        <div id="zona-juego" hidden>

            <!-- Numero de la pista actual -->
            <p id="numero-pista"></p>

            <!-- Aqui se coloca la pista -->
            <div id="pista"></div>

            <!-- Indica si es sinonimo, hiperonimo o hiponimo -->
            <p id="relacion-pista"></p>

            <!-- Entrada de la respuesta -->
            <input
                type="text"
                id="respuesta"
                placeholder="Escribe tu respuesta"
            >

            <button class="btn-principal" id="responder">
                Responder
            </button>

            <!-- Mensajes como correcta o incorrecta -->
            <p id="mensaje"></p>

            <!-- Cantidad de intentos -->
            <p id="intentos"></p>

            <!-- Estado de la partida -->
            <p id="estado-juego"></p>

            <!-- Respuesta correcta al terminar -->
            <p id="respuesta-final"></p>

            <!--Se mostrara cuando termine la partida -->
            <button
                class="btn-principal"
                id="nueva-partida"
                hidden
            >
                Nueva partida
            </button>

        </div>

    </div>

</body>

</html>
