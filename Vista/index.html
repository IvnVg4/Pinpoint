<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pinpoint</title>
        <link rel="stylesheet" href="styles.css">
        <style>
            \* { box-sizing: border-box; 
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            }
            body {
                margin: 0;
                background-color: #2c3e50;
                color: #f4f6f7;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }
            .container {
                text-align: center;
                background-color: #34495e;
                color: #ffffff;         
                border-radius: 8px;       
                padding: 20px;
            }
            .container h1 {
                color: #ffffff;
                font-size: 1.8rem;
                font-weight: 700;
                margin-bottom: 8px;
            }
            p.subtitulo {
                color: #cbd5e1;
                font-size: 1rem;
                margin-top: 0;
                margin-bottom: 24px;
            }
            .container .btn-principal {
                display: inline-block;
                background-color: #0284c7;  /* Azul turquesa/brillante que resalta */
                color: #ffffff;
                padding: 12px 24px;
                font-size: 1rem;
                font-weight: 600;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                text-decoration: none;      /* Por si usas un <a> en lugar de <button> */
                transition: background-color 0.2s ease, transform 0.1s ease;
}


        </style>
</html>
